# Do not install this as pipewire.conf.d/*.conf.
# context.objects on hw:0,0 is fatal while /proc/asound/cards is empty:
#   spa.alsa: 'hw:0,0': playback open failed
#   default: failed to create context: Invalid argument
#   pipewire.service: status=234 → socket start-limit-hit → session silent.
# After /dev/snd/pcmC0D0p exists, start PipeWire; WirePlumber UCM
# publishes alsa_output.platform-sound.HiFi__Speaker__sink.
# See linux-mainline/scripts/dagu-audio-up.sh.
