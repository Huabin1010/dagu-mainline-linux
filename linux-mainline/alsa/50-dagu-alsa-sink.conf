# ACP never publishes the UCM HiFi profile (EnumProfile is only Off +
# pro-audio). disable-pro-audio then leaves the card Off → Dummy Output.
# Open hw:0,0 as a 2ch S24_LE sink; mixer routing stays in
# dagu-speaker-route.sh.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "alsa_output.dagu.speakers"
            node.description = "Speakers"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:0,0"
            api.alsa.period-size = 1024
            audio.channels   = 2
            audio.rate       = 48000
            audio.format     = "S24_LE"
            audio.position   = "FL,FR"
            priority.driver  = 2000
            priority.session = 2000
        }
    }
]
