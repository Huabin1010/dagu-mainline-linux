# QCA6390 A2DP must stay on Q6 SLIMBUS_7, not PipeWire SBC on the AP.
# bluez5.hw-offload makes WirePlumber look for the offload PCM instead of
# encoding on CPU. Do not add a software bluetooth sink as fallback.
monitor.bluez.properties = {
  bluez5.hw-offload-sco = true
  bluez5.enable-sbc-xq = false
  bluez5.enable-msbc = false
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        api.bluez5.hw-offload = true
        bluez5.hw-offload-sco = true
      }
    }
  }
]
