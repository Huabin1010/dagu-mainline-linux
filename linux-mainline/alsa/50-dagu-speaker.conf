# Force the dagu CS35L41 card onto UCM HiFi (2ch Speakers), not Dummy / 8ch Pro.
# Q6 exposes dozens of PCM nodes; WirePlumber then sets split-enable and
# opens <<<SplitPCM=1>>>hw:0, which has no HiFi verb → Dummy Output.
monitor.alsa.rules = [
  {
    matches = [
      { media.class = "Audio/Sink", alsa.device = "3" }
    ]
    actions = {
      update-props = {
        # MultiMedia4 playback / SLIMBUS_7_RX is BT A2DP offload. ACP
        # probing pcm3p without a QCA link AFE-enables port 0x400e →
        # EINVAL flood. One match object is AND; two objects in the
        # array would be OR and disable every Audio/Sink (Dummy).
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = true
        api.acp.auto-profile = true
        # false: do not open MM2/MM3/MM4. Mic is the linger node; BT is
        # dagu-bt-a2dp-route.sh when a headset is actually connected.
        api.acp.auto-port = false
        api.alsa.disable-pro-audio = true
        api.alsa.split-enable = false
        device.profile = "HiFi"
        device.nick = "Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.rate = 48000
        audio.format = "S24_LE"
        alsa.resolution_bits = 24
        # Do not bind GNOME volume to Digital PCM — that is digital gain.
        # Keep chip Digital at 0 dB; loudness is DSP + analog 18 + DRE.
        api.alsa.soft-mixer = true
        audio.position = [ FL FR ]
        node.nick = "Speakers"
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.platform-sound.*" }
      { node.name = "dagu-builtin-mic" }
    ]
    actions = {
      update-props = {
        audio.channels = 1
        audio.rate = 48000
        audio.format = "S16LE"
        # Q6 S24_LE is not spa S24_32LE. 16-bit here is the native PCM.
        alsa.resolution_bits = 16
        audio.position = [ MONO ]
        api.alsa.soft-mixer = true
        api.alsa.disable-tsched = true
        session.suspend-timeout-seconds = 0
        node.always-process = true
        node.nick = "Microphone"
        node.description = "Built-in Microphone"
        priority.session = 2000
      }
    }
  }
]
