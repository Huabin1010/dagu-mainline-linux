# Force the dagu CS35L41 card onto UCM HiFi (2ch Speakers), not Dummy / 8ch Pro.
# Q6 exposes dozens of PCM nodes; WirePlumber then sets split-enable and
# opens <<<SplitPCM=1>>>hw:0, which has no HiFi verb → Dummy Output.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = true
        api.acp.auto-profile = true
        api.acp.auto-port = true
        api.alsa.disable-pro-audio = true
        api.alsa.split-enable = false
        device.profile = "HiFi"
        device.nick = "Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.rate = 48000
        audio.format = "S24_LE"
        alsa.resolution_bits = 24
        # Do not bind GNOME volume to Digital PCM — that is digital gain.
        # Keep chip Digital at 0 dB; loudness is DSP + analog 18 + DRE.
        api.alsa.soft-mixer = true
        audio.position = [ FL FR ]
        node.nick = "Speakers"
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.channels = 1
        audio.rate = 48000
        api.alsa.soft-mixer = true
        node.nick = "Microphone"
        node.description = "Built-in Microphone"
        priority.session = 2000
      }
    }
  }
]
