[General]
# Classic HID (Logitech K380 and similar LegacyPairing keyboards) must open
# the HID channel before bonding finishes so the PIN can be entered on the
# keyboard. BlueZ 5.64+ defaults ClassicBondedOnly=true, which rejects that
# connection (profiles/input/device.c hidp_add_connection) and GNOME shows
# Connected with no /dev/input node.
ClassicBondedOnly=false

# Persist the UHID node across classic HID reconnect so the first key after
# the keyboard wakes is not eaten (BlueZ #737; Android/Windows keep the
# node). Do not set UserspaceHID=false — kernel HIDP reconnect fails with
# br-connection-create-socket on this stack.
UserspaceHID=persist

# Keep adapter DiscoverableTimeout (default 180s); do not leave ISCAN on.
# Page scan (HCI_CONNECTABLE / FastConnectable) must stay on — Forget of the
# last classic HID device otherwise drops SCAN_PAGE. PairableTimeout=0.
# Do not disable sniff, UART runtime PM, or QCA IBS:
# those are how the keyboard/mouse radio-sleep and wake the tablet.
# Classic HID discovery: BR-only Inquiry (scripts/dagu-bt-bredr-scan.sh), not
# dual-mode scan while the BLE mouse is connected, and not hcitool cc.
