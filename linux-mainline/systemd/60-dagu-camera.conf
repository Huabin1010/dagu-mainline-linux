# Chrome getUserMedia uses PipeWire Video/Source. spa-libcamera CPU-debayers
# s5kjn1 4080x3060 on the session CPUs and starves mutter SCHED_DEADLINE
# (dmesg: "DL replenish lagged too much" → UI freeze). SoftISP stays in
# dagu-camera-loopback-watch (CPU 0-3) feeding /dev/video20/21.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

# spa-v4l2 cannot open CAMSS MPLANE RDI. Venus is /dev/video14/15.
# Loopback /dev/video20/21 is the desktop camera (Snapshot, Chromium).
# session.suspend-timeout-seconds=0: a 3s suspend closes CAPTURE under
# GNOME Snapshot and watch restamps gray YUYV (Y=U=V=0x80). Meeting
# uses V4L2 mmap and never hits this node.
# node.want-driver=false: loopback timestamps are not a graph clock.
# Using them as pipewireclock0 froze Snapshot on the first gray stamp.
# api.libcamera.location=external on front: Aperture Front would add a
# second selfie on top of gtk4paintablesink's H-mirror. spa-v4l2 H-flips
# only /dev/video21 so GNOME rear matches Meeting; front stays identity
# so gtk H-mirror is the GNOME selfie. Meeting mmap never hits spa.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.path = "/dev/video0" }
      { api.v4l2.path = "/dev/video1" }
      { api.v4l2.path = "/dev/video2" }
      { api.v4l2.path = "/dev/video3" }
      { api.v4l2.path = "/dev/video4" }
      { api.v4l2.path = "/dev/video5" }
      { api.v4l2.path = "/dev/video6" }
      { api.v4l2.path = "/dev/video7" }
      { api.v4l2.path = "/dev/video8" }
      { api.v4l2.path = "/dev/video9" }
      { api.v4l2.path = "/dev/video10" }
      { api.v4l2.path = "/dev/video11" }
      { api.v4l2.path = "/dev/video12" }
      { api.v4l2.path = "/dev/video13" }
      { api.v4l2.path = "/dev/video14" }
      { api.v4l2.path = "/dev/video15" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.path = "/dev/video20" }
    ]
    actions = {
      update-props = {
        node.description = "dagu Front Camera"
        media.role = "Camera"
        api.libcamera.location = "external"
        priority.session = 810
        node.always-process = false
        node.want-driver = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { api.v4l2.path = "/dev/video21" }
    ]
    actions = {
      update-props = {
        node.description = "dagu Rear Camera"
        media.role = "Camera"
        api.libcamera.location = "back"
        priority.session = 800
        node.always-process = false
        node.want-driver = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
