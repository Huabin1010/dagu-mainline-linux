# /etc/systemd/system/fstrim.timer.d/dagu-daily.conf
#
# The UFS (WDC SDINFDK4-128G) runs WriteBooster in preserve-user-space
# mode: its SLC write buffer is carved out of LBAs the device knows are
# free. Blocks ext4 frees stay mapped until a discard, so with the stock
# weekly fstrim the buffer sat at 0 (attributes/wb_cur_buf=0, "dCurWBBuf:
# 0 WB disabled" about 14k times a day) and every write went straight to
# TLC. One fstrim returned 78 GiB and wb_cur_buf to 0xC00. Trim daily,
# like Android's idle maintenance, and catch up after a missed day.
[Timer]
OnCalendar=
OnCalendar=daily
Persistent=true
RandomizedDelaySec=30min
