[Login]
# GPIO110 hall is SW_LID (cover over the screen). Folio close must
# sleep; that is the Android cover path. Do not ignore the lid.
# gsd-media-keys holds a BLOCK inhibitor on handle-power-key, so
# HandlePowerKey here is backup only. Short KEY_POWER is
# org.gnome.settings-daemon.plugins.power power-button-action=suspend.
# Long press is not a dialog (that was EndSessionDialog / the card).
HandlePowerKey=suspend
HandlePowerKeyLongPress=ignore
HandleSuspendKey=suspend
HandleHibernateKey=ignore
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
# gsd-power takes handle-lid-switch after DSI resume ("external
# monitor or configuration changed"). This folio has only DSI-1.
# Cover-over-screen is GPIO110 SW_LID and must still sleep.
LidSwitchIgnoreInhibited=yes
# Default 30s after resume drops the next folio close. Android
# has no such hold-off.
HoldoffTimeoutSec=2s
IdleAction=ignore
