# v4l2loopback is an App bridge, not Spectra ISP.
# /dev/video20 front, /dev/video21 rear. Do not use 10-15 (Venus is 14/15).
# exclusive_caps=1: announce CAPTURE only after stamp/keep_format.
# Chrome V4L2 skips nodes that also advertise OUTPUT (exclusive_caps=0).
# Watch stamps YUYV 1280x720 at start so capture is visible before STREAMON.
# max_buffers=4: xcast REQBUFS(4) then mmap only those 4 slots.
# max_buffers=8 granted extra indices; DQBUF 4..7 SIGSEGV on rear→front.
options v4l2loopback devices=2 video_nr=20,21 exclusive_caps=1,1 max_buffers=4 card_label=dagu-front,dagu-rear
