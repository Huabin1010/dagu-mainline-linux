# v4l2loopback is an App bridge, not Spectra ISP.
# /dev/video20 front, /dev/video21 rear. Do not use 10-15 (Venus is 14/15).
# exclusive_caps=0 so a V4L2 client can open capture before the on-demand
# producer STREAMONs. PipeWire lists video20/21; spa-libcamera is disabled.
# max_buffers=8: xcast/webrtc REQBUFS(4). Default 2 makes QBUF fail with
# "Not enough buffer" / "Could not requeue" → meeting preview stays black.
options v4l2loopback devices=2 video_nr=20,21 exclusive_caps=0 max_buffers=8 card_label=dagu-front,dagu-rear
